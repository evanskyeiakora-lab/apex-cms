<div class="p-4 text-center border-bottom">

    <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        class="img-fluid mb-2"
        style="max-height:70px;">

    <h5 class="text-white fw-bold mt-3">
    Apex CMS
</h5>

</div>

<ul class="nav flex-column py-3">

    <!-- Dashboard -->

    <li class="nav-item">

        <a
            href="{{ url_for('admin.dashboard') }}"
            class="nav-link text-white {% if request.endpoint == 'admin.dashboard' %}active{% endif %}">

            <i class="fas fa-gauge-high me-2"></i>

            Dashboard

        </a>

    </li>

    <!-- ========================= -->
    <!-- Content -->
    <!-- ========================= -->

    <li class="nav-header text-uppercase text-secondary px-3 mt-3 mb-2">

        Content

    </li>

    <li class="nav-item">

        <a
            href="{{ url_for('hero.index') }}"
            class="nav-link text-white {% if request.endpoint and request.endpoint.startswith('hero.') %}active{% endif %}">

            <i class="fas fa-images me-2"></i>

            Hero Slider

        </a>

    </li>

    <li class="nav-item">

        <a
            href="{{ url_for('pages.index') }}"
            class="nav-link text-white {% if request.endpoint and request.endpoint.startswith('pages.') %}active{% endif %}">

            <i class="fas fa-file-alt me-2"></i>

            Pages

        </a>

    </li>

    <li class="nav-item">

        <a
            href="{{ url_for('news.index') }}"
            class="nav-link text-white {% if request.endpoint and request.endpoint.startswith('news.') %}active{% endif %}">

            <i class="fas fa-newspaper me-2"></i>

            News

        </a>

    </li>

    <li class="nav-item">

        <a
            href="{{ url_for('events.index') }}"
            class="nav-link text-white {% if request.endpoint and request.endpoint.startswith('events.') %}active{% endif %}">

            <i class="fas fa-calendar-days me-2"></i>

            Events

        </a>

    </li>

    <li class="nav-item">

        <a
            href="{{ url_for('gallery.index') }}"
            class="nav-link text-white {% if request.endpoint and request.endpoint.startswith('gallery.') %}active{% endif %}">

            <i class="fas fa-image me-2"></i>

            Gallery

        </a>

    </li>

    <!-- ========================= -->
    <!-- People -->
    <!-- ========================= -->

    <li class="nav-header text-uppercase text-secondary px-3 mt-3 mb-2">

        People

    </li>

    <li class="nav-item">

        <a
            href="{{ url_for('members.index') }}"
            class="nav-link text-white {% if request.endpoint and request.endpoint.startswith('members.') %}active{% endif %}">

            <i class="fas fa-users me-2"></i>

            Members

        </a>

    </li>

    <!-- ========================= -->
    <!-- Communication -->
    <!-- ========================= -->

    <li class="nav-header text-uppercase text-secondary px-3 mt-3 mb-2">

        Communication

    </li>

    <li class="nav-item">

        <a
            href="{{ url_for('contact.admin_index') }}"
            class="nav-link text-white {% if request.endpoint and request.endpoint.startswith('contact.') %}active{% endif %}">

            <i class="fas fa-envelope me-2"></i>

            Messages

        </a>

    </li>

    <!-- ========================= -->
    <!-- System -->
    <!-- ========================= -->

    <li class="nav-header text-uppercase text-secondary px-3 mt-3 mb-2">

        System

    </li>

    {% if current_user.is_admin %}

    <li class="nav-item">

        <a
            href="{{ url_for('users.index') }}"
            class="nav-link text-white {% if request.endpoint and request.endpoint.startswith('users.') %}active{% endif %}">

            <i class="fas fa-user-shield me-2"></i>

            Users

        </a>

    </li>

    {% endif %}

    <li class="nav-item">

        <a
            href="{{ url_for('settings.index') }}"
            class="nav-link text-white {% if request.endpoint and request.endpoint.startswith('settings.') %}active{% endif %}">

            <i class="fas fa-gear me-2"></i>

            Settings

        </a>

    </li>

    <li class="nav-item">

        <a
            href="{{ url_for('auth.logout') }}"
            class="nav-link text-danger">

            <i class="fas fa-right-from-bracket me-2"></i>

            Logout

        </a>

    </li>

</ul>
