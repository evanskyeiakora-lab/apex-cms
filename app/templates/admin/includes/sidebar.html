<div class="sidebar-header">

    <a href="{{ url_for('admin.dashboard') }}"
       class="brand">

        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="Apex CMS Logo"
             class="brand-logo">

        <div class="brand-text">

            <h4>Apex CMS</h4>

            <small>Administration</small>

        </div>

    </a>

</div>

<nav class="sidebar-nav">

    <ul>

        <!-- ===================== -->
        <!-- Dashboard -->
        <!-- ===================== -->

        <li class="nav-title">

            MAIN

        </li>

        <li>

            <a href="{{ url_for('admin.dashboard') }}"
               class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">

                <i class="fas fa-gauge-high"></i>

                <span>Dashboard</span>

            </a>

        </li>

        <!-- ===================== -->
        <!-- Content -->
        <!-- ===================== -->

        <li class="nav-title">

            CONTENT

        </li>

        <li>

            <a href="{{ url_for('hero.index') }}"
               class="{% if request.endpoint and request.endpoint.startswith('hero.') %}active{% endif %}">

                <i class="fas fa-images"></i>

                <span>Hero Slider</span>

            </a>

        </li>

        <li>

            <a href="{{ url_for('pages.index') }}"
               class="{% if request.endpoint and request.endpoint.startswith('pages.') %}active{% endif %}">

                <i class="fas fa-file-alt"></i>

                <span>Pages</span>

            </a>

        </li>

        <li>

            <a href="{{ url_for('news.index') }}"
               class="{% if request.endpoint and request.endpoint.startswith('news.') %}active{% endif %}">

                <i class="fas fa-newspaper"></i>

                <span>News</span>

            </a>

        </li>

        <li>

            <a href="{{ url_for('events.index') }}"
               class="{% if request.endpoint and request.endpoint.startswith('events.') %}active{% endif %}">

                <i class="fas fa-calendar-days"></i>

                <span>Events</span>

            </a>

        </li>

        <li>

            <a href="{{ url_for('gallery.index') }}"
               class="{% if request.endpoint and request.endpoint.startswith('gallery.') %}active{% endif %}">

                <i class="fas fa-image"></i>

                <span>Gallery</span>

            </a>

        </li>

        <!-- ===================== -->
        <!-- People -->
        <!-- ===================== -->

        <li class="nav-title">

            PEOPLE

        </li>

        <li>

            <a href="{{ url_for('members.index') }}"
               class="{% if request.endpoint and request.endpoint.startswith('members.') %}active{% endif %}">

                <i class="fas fa-users"></i>

                <span>Members</span>

            </a>

        </li>

        <!-- ===================== -->
        <!-- Communication -->
        <!-- ===================== -->

        <li class="nav-title">

            COMMUNICATION

        </li>

        <li>

            <a href="{{ url_for('contact.admin_index') }}"
               class="{% if request.endpoint and request.endpoint.startswith('contact.') %}active{% endif %}">

                <i class="fas fa-envelope"></i>

                <span>Messages</span>

            </a>

        </li>

        <!-- ===================== -->
        <!-- System -->
        <!-- ===================== -->

        <li class="nav-title">

            SYSTEM

        </li>

        {% if current_user.is_admin %}

        <li>

            <a href="{{ url_for('users.index') }}"
               class="{% if request.endpoint and request.endpoint.startswith('users.') %}active{% endif %}">

                <i class="fas fa-user-shield"></i>

                <span>Users</span>

            </a>

        </li>

        {% endif %}

        <li>

            <a href="{{ url_for('settings.index') }}"
               class="{% if request.endpoint and request.endpoint.startswith('settings.') %}active{% endif %}">

                <i class="fas fa-gear"></i>

                <span>Settings</span>

            </a>

        </li>

    </ul>

</nav>

<div class="sidebar-footer">

    <a href="{{ url_for('auth.logout') }}"
       class="logout-link">

        <i class="fas fa-right-from-bracket"></i>

        <span>Logout</span>

    </a>

</div>
